"pt-BR":
  app:
    nome: "USE CHAOS"
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d de %B de %Y"
    day_names: [domingo, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado]
    month_names: [~, janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%d de %B de %Y às %H:%M"
  number:
    currency:
      format:
        unit: "R$"
        delimiter: "."
        separator: ","
        precision: 2
        format: "%u %n"
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "não pode ficar em branco"
      invalid: "não é válido"
      taken: "já está em uso"
      greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
      less_than_or_equal_to: "deve ser menor ou igual a %{count}"
  activerecord:
    attributes:
      usuario_administrativo:
        current_password: "Senha atual"
        password: "Senha"
        password_confirmation: "Confirmação da senha"
        whatsapp: "WhatsApp"
    errors:
      messages:
        record_invalid: "Falha na validação: %{errors}"
        restrict_dependent_destroy:
          has_one: "Não é possível excluir porque existe um %{record} dependente"
          has_many: "Não é possível excluir porque existem %{record} dependentes"
